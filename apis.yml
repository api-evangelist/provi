name: Provi
description: 'Provi is a B2B beverage alcohol marketplace that digitizes procurement
  across the three-tier distribution system, connecting buyers (bars, restaurants,
  and retail stores) with distributors, sales representatives, and suppliers/brands.
  The platform consolidates product discovery across distributor catalogs, direct
  messaging with sales reps, order management and processing, and brand showcase tools
  into a single ordering experience. Provi was surfaced as a portfolio company of
  Bessemer Venture Partners and added to the API Evangelist network. As of this enrichment
  pass the company publishes no public developer API, OpenAPI, or developer portal;
  this profile captures its identity, web properties, and domain-security posture.'
